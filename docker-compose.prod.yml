services:
  db:
    image: postgres:16-alpine
    container_name: multirutinas_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multirutinas_db}
      POSTGRES_USER: ${POSTGRES_USER:-multirutinas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multirutinas_user} -d ${POSTGRES_DB:-multirutinas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multirutinas_web
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    dns:
      - 1.1.1.1
      - 8.8.8.8

  nginx:
    image: nginx:alpine
    container_name: multirutinas_nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - backend-network
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.multirutinas.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.multirutinas.entrypoints=websecure"
      - "traefik.http.routers.multirutinas.tls.certresolver=myresolver"
      - "traefik.http.services.multirutinas.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-network"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  backend-network:
    driver: bridge
  proxy-network:
    external: true
    name: proxy-network

