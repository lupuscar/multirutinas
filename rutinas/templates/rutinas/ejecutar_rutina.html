{% extends 'base.html' %}

{% block title %}Entrenando: {{ rutina.nombre }} | FitApp{% endblock %}

{% block bottom_navigation %}{% endblock %}

{% block content %}
<div x-data="modoGym()" x-init="iniciarModoGym()" class="max-w-2xl mx-auto pb-32">

    <!-- ================================================================= -->
    <!-- BARRA SUPERIOR FIJA: PROGRESO Y CRONÓMETRO DE SESIÓN -->
    <!-- ================================================================= -->
    <div class="sticky top-0 z-20 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md -mx-4 px-4 py-3 border-b border-gray-200 dark:border-gray-800 shadow-sm mb-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="{% url 'rutinas:lista_rutinas' %}" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 flex items-center justify-center hover:bg-gray-200 text-sm">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <div>
                    <h1 class="text-base font-extrabold text-gray-900 dark:text-white truncate max-w-[160px] sm:max-w-xs">
                        {{ rutina.nombre }}
                    </h1>
                    <div class="flex items-center space-x-2 text-xs text-gray-500 dark:text-gray-400">
                        <span class="inline-flex items-center text-brand-light font-bold">
                            <i class="fa-regular fa-clock mr-1"></i> <span x-text="tiempoSesionFormateado"></span>
                        </span>
                        <span>•</span>
                        <span x-text="seriesCompletadasTotales + '/' + totalSeriesTotales + ' series'"></span>
                    </div>
                </div>
            </div>

            <!-- Acciones Superiores: Wake Lock & Finalizar Sesión -->
            <div class="flex items-center space-x-2">
                <!-- Botón Mantener Pantalla Activa (Wake Lock) -->
                <button type="button" @click="alternarWakeLock()" 
                        :title="wakeLockActivo ? 'Pantalla siempre activa (activada)' : 'Toca para mantener pantalla encendida durante el entrenamiento'"
                        class="px-2.5 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center space-x-1.5 active:scale-95"
                        :class="wakeLockActivo ? 'bg-amber-500/10 border-amber-500/30 text-amber-500' : 'bg-gray-100 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-400'">
                    <i class="fa-solid fa-lightbulb text-xs" :class="wakeLockActivo ? 'animate-pulse text-amber-400' : ''"></i>
                    <span class="hidden sm:inline" x-text="wakeLockActivo ? 'Pantalla Activa' : 'Mantener Pantalla'"></span>
                </button>

                <!-- Botón Finalizar Sesión -->
                <button type="button" @click="finalizarEntrenamiento()" 
                        class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20 flex items-center space-x-1.5 transition-transform active:scale-95">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <span>Terminar</span>
                </button>
            </div>
        </div>

        <!-- Barra de progreso general -->
        <div class="w-full bg-gray-100 dark:bg-gray-800 h-1.5 rounded-full mt-2.5 overflow-hidden">
            <div class="bg-gradient-to-r from-brand-light to-emerald-500 h-full transition-all duration-300"
                 :style="'width: ' + porcentajeProgreso + '%'"></div>
        </div>
    </div>


    <!-- ================================================================= -->
    <!-- LISTA DE EJERCICIOS (TARJETAS MODO GYM TÁCTILES) -->
    <!-- ================================================================= -->
    <div class="space-y-6">
        
        <template x-for="(item, ejIndex) in ejercicios" :key="item.ejercicio_id">
            <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700/80 overflow-hidden">
                
                <!-- Cabecera del Ejercicio -->
                <div class="p-4 bg-gray-50/80 dark:bg-gray-700/40 border-b border-gray-100 dark:border-gray-700/60 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-xl bg-brand-light/10 text-brand-light font-black text-sm flex items-center justify-center" x-text="ejIndex + 1"></span>
                        <div>
                            <h2 class="font-extrabold text-base text-gray-900 dark:text-white" x-text="item.ejercicio_nombre"></h2>
                            <div class="flex items-center space-x-2 text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                                <span x-text="item.grupo_muscular"></span>
                                <span>•</span>
                                <span class="font-semibold" :class="item.modalidad === 'TIEMPO' ? 'text-amber-500' : 'text-blue-500'" 
                                      x-text="item.modalidad === 'TIEMPO' ? '⏱️ Por tiempo' : '🏋️ Peso y Reps'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Lista de Series del Ejercicio -->
                <div class="p-3 sm:p-4 space-y-3">
                    
                    <template x-for="(serie, sIndex) in item.series_sugeridas" :key="serie.numero_serie">
                        <div class="p-3 rounded-2xl border transition-all duration-200"
                             :class="serie.completado ? 'bg-emerald-50/70 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-800/60' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700'">
                            
                            <!-- Barra superior contextual: Historial previo / Replicación -->
                            <div class="flex items-center justify-between text-[11px] mb-2 px-1 pb-1 border-b border-gray-100 dark:border-gray-700/50"
                                 x-show="(serie.peso_anterior || serie.reps_anteriores) && item.modalidad !== 'TIEMPO'">
                                <button type="button" @click="aplicarValoresPrevios(item, serie)" 
                                        class="text-[10px] text-brand-light font-bold hover:underline flex items-center space-x-1"
                                        title="Toca para cargar los datos de tu última sesión">
                                    <i class="fa-solid fa-clock-rotate-left text-[9px]"></i>
                                    <span>Anterior: <strong x-text="serie.peso_anterior ? serie.peso_anterior + ' kg' : 'Corporal'"></strong> <span x-show="serie.reps_anteriores" x-text="'× ' + serie.reps_anteriores + ' reps'"></span></span>
                                </button>
                                <button type="button" @click="replicarSerie(item, serie)" 
                                        class="text-[10px] text-gray-400 hover:text-brand-light font-semibold flex items-center space-x-1"
                                        title="Copiar este peso y repeticiones a las series siguientes">
                                    <i class="fa-solid fa-copy text-[9px]"></i>
                                    <span>Copiar a siguientes</span>
                                </button>
                            </div>

                            <div class="flex items-center justify-between gap-2">
                                
                                <!-- Número de Serie -->
                                <div class="w-8 text-center shrink-0">
                                    <span class="font-black text-sm" 
                                          :class="serie.completado ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-400'"
                                          x-text="'S' + serie.numero_serie"></span>
                                </div>

                                <!-- CONTROLES DE LA SERIE: MODO PESO + REPETICIONES -->
                                <template x-if="item.modalidad !== 'TIEMPO'">
                                    <div class="flex-1 grid grid-cols-2 gap-2">
                                        
                                        <!-- Peso (kg) con botones rápidos táctiles -->
                                        <div class="flex items-center bg-gray-50 dark:bg-gray-900/60 rounded-xl p-1 border border-gray-200/80 dark:border-gray-700/60">
                                            <button type="button" @click="ajustarValor(item, serie, 'peso_kg', -5)" 
                                                    class="w-6 h-8 rounded-lg text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 font-bold text-[10px] flex items-center justify-center active:scale-95" title="-5 kg">-5</button>
                                            <button type="button" @click="ajustarValor(item, serie, 'peso_kg', -1)" 
                                                    class="w-7 h-8 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95">-</button>
                                            <div class="flex-1 text-center px-1">
                                                <input type="number" step="0.5" x-model="serie.peso_kg" placeholder="0" 
                                                       @input="autopropagarSiAplica(item, serie)"
                                                       @change="guardarSerie(item, serie)"
                                                       class="w-full text-center font-black text-sm text-gray-900 dark:text-white bg-transparent outline-none">
                                                <span class="block text-[9px] text-gray-400 uppercase font-bold -mt-1">kg</span>
                                            </div>
                                            <button type="button" @click="ajustarValor(item, serie, 'peso_kg', 1)" 
                                                    class="w-7 h-8 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95">+</button>
                                            <button type="button" @click="ajustarValor(item, serie, 'peso_kg', 5)" 
                                                    class="w-6 h-8 rounded-lg text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 font-bold text-[10px] flex items-center justify-center active:scale-95" title="+5 kg">+5</button>
                                        </div>

                                        <!-- Repeticiones con botones rápidos táctiles -->
                                        <div class="flex items-center bg-gray-50 dark:bg-gray-900/60 rounded-xl p-1 border border-gray-200/80 dark:border-gray-700/60">
                                            <button type="button" @click="ajustarValor(item, serie, 'repeticiones', -1)" 
                                                    class="w-7 h-8 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95">-</button>
                                            <div class="flex-1 text-center px-1">
                                                <input type="number" x-model.number="serie.repeticiones" placeholder="10" 
                                                       @change="guardarSerie(item, serie)"
                                                       class="w-full text-center font-black text-sm text-gray-900 dark:text-white bg-transparent outline-none">
                                                <span class="block text-[9px] text-gray-400 uppercase font-bold -mt-1">reps</span>
                                            </div>
                                            <button type="button" @click="ajustarValor(item, serie, 'repeticiones', 1)" 
                                                    class="w-7 h-8 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95">+</button>
                                        </div>

                                    </div>
                                </template>

                                <!-- CONTROLES DE LA SERIE: MODO TIEMPO / DURACIÓN -->
                                <template x-if="item.modalidad === 'TIEMPO'">
                                    <div class="flex-1 flex flex-col space-y-1.5">
                                        <!-- Control principal de tiempo: Minutos o Segundos -->
                                        <div class="flex items-center bg-gray-50 dark:bg-gray-900/60 rounded-xl p-1.5 border border-gray-200/80 dark:border-gray-700/60">
                                            <!-- Botón Menos -->
                                            <button type="button" @click="ajustarTiempoInteligente(item, serie, -1)" 
                                                    class="px-2.5 h-8 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95 cursor-pointer"
                                                    :title="serie.unidad_tiempo === 'min' ? (serie.tiempo_minutos >= 10 ? '-5 min' : '-1 min') : '-5 seg'"
                                                    x-text="serie.unidad_tiempo === 'min' ? (serie.tiempo_minutos >= 10 ? '-5m' : '-1m') : '-5s'"></button>
                                            
                                            <!-- Input y Unidad -->
                                            <div class="flex-1 text-center px-2">
                                                <div class="flex items-center justify-center space-x-1">
                                                    <!-- Modo Minutos (cuando >= 5 min o cardio) -->
                                                    <template x-if="serie.unidad_tiempo === 'min'">
                                                        <div class="flex items-center justify-center space-x-1">
                                                            <input type="number" step="0.5" min="0.5" 
                                                                   x-model="serie.tiempo_minutos" 
                                                                   @input="actualizarDesdeMinutos(serie)"
                                                                   @change="guardarSerie(item, serie)"
                                                                   placeholder="15" 
                                                                   class="w-16 text-center font-black text-sm sm:text-base text-gray-900 dark:text-white bg-transparent outline-none">
                                                            <button type="button" @click="conmutarUnidadTiempo(serie)" 
                                                                    class="text-xs text-brand-light font-black uppercase hover:underline cursor-pointer" 
                                                                    title="Toca para cambiar a segundos">min</button>
                                                        </div>
                                                    </template>

                                                    <!-- Modo Segundos (para ejercicios isométricos cortos < 5 min) -->
                                                    <template x-if="serie.unidad_tiempo !== 'min'">
                                                        <div class="flex items-center justify-center space-x-1">
                                                            <input type="number" step="5" min="5" 
                                                                   x-model.number="serie.tiempo_segundos" 
                                                                   @input="actualizarDesdeSegundos(serie)"
                                                                   @change="guardarSerie(item, serie)"
                                                                   placeholder="45" 
                                                                   class="w-16 text-center font-black text-sm sm:text-base text-gray-900 dark:text-white bg-transparent outline-none">
                                                            <button type="button" @click="conmutarUnidadTiempo(serie)" 
                                                                    class="text-[10px] text-gray-400 font-semibold hover:underline cursor-pointer" 
                                                                    title="Toca para cambiar a minutos">seg</button>
                                                        </div>
                                                    </template>
                                                </div>
                                                <span class="block text-[10px] text-gray-400 font-medium -mt-0.5" 
                                                      x-text="formatearSegundosHumano(serie.tiempo_segundos)"></span>
                                            </div>

                                            <!-- Botón Más -->
                                            <button type="button" @click="ajustarTiempoInteligente(item, serie, 1)" 
                                                    class="px-2.5 h-8 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95 cursor-pointer"
                                                    :title="serie.unidad_tiempo === 'min' ? (serie.tiempo_minutos >= 10 ? '+5 min' : '+1 min') : '+5 seg'"
                                                    x-text="serie.unidad_tiempo === 'min' ? (serie.tiempo_minutos >= 10 ? '+5m' : '+1m') : '+5s'"></button>
                                        </div>

                                        <!-- Presets rápidos -->
                                        <div class="flex items-center justify-center gap-1">
                                            <template x-if="serie.unidad_tiempo === 'min'">
                                                <div class="flex items-center gap-1">
                                                    <button type="button" @click="fijarTiempoMinutos(item, serie, 5)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">5m</button>
                                                    <button type="button" @click="fijarTiempoMinutos(item, serie, 15)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">15m</button>
                                                    <button type="button" @click="fijarTiempoMinutos(item, serie, 30)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">30m</button>
                                                    <button type="button" @click="fijarTiempoMinutos(item, serie, 45)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">45m</button>
                                                    <button type="button" @click="fijarTiempoMinutos(item, serie, 60)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">60m</button>
                                                </div>
                                            </template>
                                            <template x-if="serie.unidad_tiempo !== 'min'">
                                                <div class="flex items-center gap-1">
                                                    <button type="button" @click="fijarTiempoSegundos(item, serie, 20)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">20s</button>
                                                    <button type="button" @click="fijarTiempoSegundos(item, serie, 30)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">30s</button>
                                                    <button type="button" @click="fijarTiempoSegundos(item, serie, 45)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">45s</button>
                                                    <button type="button" @click="fijarTiempoSegundos(item, serie, 60)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">60s</button>
                                                    <button type="button" @click="fijarTiempoSegundos(item, serie, 90)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-gray-100 dark:bg-gray-700 hover:bg-brand-light hover:text-white text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">90s</button>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Si es ejercicio de carrera / distancia, fila para Distancia (km) -->
                                        <template x-if="item.es_distancia">
                                            <div class="flex items-center bg-emerald-50/50 dark:bg-emerald-950/20 rounded-xl p-1 border border-emerald-200/50 dark:border-emerald-800/40">
                                                <button type="button" @click="ajustarDistanciaSerie(item, serie, -0.5)" 
                                                        class="w-7 h-7 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95 cursor-pointer">-</button>
                                                <div class="flex-1 text-center px-1">
                                                    <div class="flex items-center justify-center space-x-1">
                                                        <i class="fa-solid fa-route text-[10px] text-emerald-500"></i>
                                                        <input type="number" step="0.1" x-model="serie.distancia_km" placeholder="0.0" 
                                                               @change="guardarSerie(item, serie)"
                                                               class="w-16 text-center font-black text-sm text-gray-900 dark:text-white bg-transparent outline-none">
                                                        <span class="text-[10px] text-gray-400 font-semibold">km</span>
                                                    </div>
                                                    <template x-if="calcularRitmoSerie(serie)">
                                                        <span class="block text-[9px] text-emerald-600 dark:text-emerald-400 font-bold -mt-0.5" 
                                                              x-text="calcularRitmoSerie(serie)"></span>
                                                    </template>
                                                </div>
                                                <button type="button" @click="ajustarDistanciaSerie(item, serie, 0.5)" 
                                                        class="w-7 h-7 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold text-xs shadow-xs hover:bg-gray-100 flex items-center justify-center active:scale-95 cursor-pointer">+</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- BOTÓN COMPLETAR SERIE (1-TAP TOUCH) -->
                                <button type="button" @click="alternarSerieCompletada(item, serie)" 
                                        :class="serie.completado ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/30' : 'bg-gray-100 dark:bg-gray-700 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'"
                                        class="w-12 h-11 rounded-xl flex items-center justify-center transition-all duration-200 active:scale-90 font-bold">
                                    <i class="fa-solid fa-check text-base"></i>
                                </button>

                            </div>

                        </div>
                    </template>

                    <!-- Botón para añadir una serie extra en caliente -->
                    <button type="button" @click="agregarSerieExtra(item)" 
                            class="w-full py-2.5 rounded-xl border border-dashed border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:text-brand-light hover:border-brand-light font-bold text-xs transition-colors flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>Añadir Serie Extra</span>
                    </button>

                </div>

            </div>
        </template>

    </div>


    <!-- ================================================================= -->
    <!-- TEMPORIZADOR FLOTANTE DE DESCANSO ("REST TIMER") -->
    <!-- ================================================================= -->
    <div x-show="descansoActivo" x-cloak 
         class="fixed bottom-4 left-4 right-4 max-w-md mx-auto z-40 bg-gray-900/95 dark:bg-gray-950/95 backdrop-blur-md rounded-2xl p-4 text-white shadow-2xl border border-gray-700/60 transition-all transform duration-300">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Indicador animado -->
                <div class="w-11 h-11 rounded-xl bg-brand-light/30 border border-brand-light flex items-center justify-center text-brand-light font-black text-lg">
                    <i class="fa-solid fa-stopwatch animate-pulse"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Tiempo de Descanso</span>
                    <span class="text-2xl font-black text-white tracking-tight" x-text="formatearSegundos(descansoRestante)"></span>
                </div>
            </div>

            <!-- Botones Rápidos de Tiempo (+30s / Saltar) -->
            <div class="flex items-center space-x-2">
                <button type="button" @click="sumarDescanso(30)" 
                        class="px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-bold text-gray-300 transition-colors">
                    +30s
                </button>
                <button type="button" @click="detenerDescanso()" 
                        class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Barra de progreso de descanso -->
        <div class="w-full bg-gray-800 h-1.5 rounded-full mt-3 overflow-hidden">
            <div class="bg-brand-light h-full transition-all duration-1000 ease-linear"
                 :style="'width: ' + ((descansoRestante / descansoTotal) * 100) + '%'"></div>
        </div>
    </div>

</div>

<!-- Audio para notificación de fin de descanso -->
<audio id="audioFinDescanso" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
function modoGym() {
    return {
        rutinaNombre: '{{ rutina.nombre|escapejs }}',
        ejercicios: JSON.parse('{{ rutina_preparada_json|escapejs }}'),
        csrfToken: '{{ csrf_token }}',

        // Temporizador de sesión total
        segundosSesion: 0,
        intervaloSesion: null,

        // Screen Wake Lock API (Evitar que se apague la pantalla en el gym)
        wakeLock: null,
        wakeLockActivo: false,

        // Temporizador de descanso (Rest timer)
        descansoActivo: false,
        descansoRestante: 60,
        descansoTotal: 60,
        intervaloDescanso: null,

        iniciarModoGym() {
            // Inicializar minutos y segundos para ejercicios por tiempo
            if (this.ejercicios && Array.isArray(this.ejercicios)) {
                this.ejercicios.forEach(item => {
                    if (item.modalidad === 'TIEMPO' && item.series_sugeridas) {
                        const nombreLower = (item.ejercicio_nombre || '').toLowerCase();
                        const esCardio = item.es_distancia || ['DEP', 'DAN', 'OUT'].includes(item.tipo) ||
                            ['correr', 'cinta', 'running', 'bici', 'ciclismo', 'spinning', 'elíptica', 'eliptica', 'senderismo', 'caminata', 'hiking', 'remo', 'nadar', 'natación', 'pádel', 'padel', 'fútbol', 'futbol', 'baloncesto'].some(k => nombreLower.includes(k));

                        item.series_sugeridas.forEach(s => {
                            let seg = parseInt(s.tiempo_segundos) || 0;
                            if (seg <= 0) {
                                seg = esCardio ? 1200 : 45;
                                s.tiempo_segundos = seg;
                            }
                            // Si el tiempo es >= 300 segundos (5 min) o cardio prolongado: modo minutos
                            if (!s.unidad_tiempo) {
                                s.unidad_tiempo = (seg >= 300 || esCardio) ? 'min' : 'seg';
                            }
                            if (s.tiempo_minutos === undefined || s.tiempo_minutos === null || s.tiempo_minutos === '') {
                                let m = Math.round((seg / 60) * 10) / 10;
                                s.tiempo_minutos = (m % 1 === 0) ? Math.round(m) : m;
                            }
                        });
                    }
                });
            }

            this.iniciarTemporizadorSesion();
            this.solicitarWakeLock();
            document.addEventListener('visibilitychange', async () => {
                if (this.wakeLockActivo && document.visibilityState === 'visible') {
                    await this.solicitarWakeLock();
                }
            });
        },

        async solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    this.wakeLock = await navigator.wakeLock.request('screen');
                    this.wakeLockActivo = true;
                    this.wakeLock.addEventListener('release', () => {
                        this.wakeLockActivo = false;
                    });
                } catch (err) {
                    console.log('Screen Wake Lock no disponible o denegado:', err);
                    this.wakeLockActivo = false;
                }
            }
        },

        async alternarWakeLock() {
            if (this.wakeLockActivo && this.wakeLock) {
                try {
                    await this.wakeLock.release();
                    this.wakeLock = null;
                    this.wakeLockActivo = false;
                } catch (e) {}
            } else {
                await this.solicitarWakeLock();
            }
        },

        iniciarTemporizadorSesion() {
            this.intervaloSesion = setInterval(() => {
                this.segundosSesion++;
            }, 1000);
        },

        get tiempoSesionFormateado() {
            const mins = Math.floor(this.segundosSesion / 60);
            const secs = this.segundosSesion % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        },

        get totalSeriesTotales() {
            return this.ejercicios.reduce((total, ej) => total + ej.series_sugeridas.length, 0);
        },

        get seriesCompletadasTotales() {
            return this.ejercicios.reduce((total, ej) => {
                return total + ej.series_sugeridas.filter(s => s.completado).length;
            }, 0);
        },

        get porcentajeProgreso() {
            if (this.totalSeriesTotales === 0) return 0;
            return Math.round((this.seriesCompletadasTotales / this.totalSeriesTotales) * 100);
        },

        formatearSegundos(seg) {
            const m = Math.floor(seg / 60);
            const s = seg % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        },

        formatearSegundosHumano(seg) {
            if (!seg) return '0s';
            seg = parseInt(seg) || 0;
            if (seg >= 3600) {
                const h = Math.floor(seg / 3600);
                const m = Math.floor((seg % 3600) / 60);
                return m > 0 ? `${h}h ${m}m` : `${h}h`;
            }
            if (seg >= 60) {
                const m = Math.floor(seg / 60);
                const s = seg % 60;
                return s > 0 ? `${m}m ${s}s` : `${m} min`;
            }
            return `${seg}s`;
        },

        conmutarUnidadTiempo(serie) {
            if (serie.unidad_tiempo === 'min') {
                serie.unidad_tiempo = 'seg';
            } else {
                serie.unidad_tiempo = 'min';
                if (!serie.tiempo_minutos) {
                    let seg = parseInt(serie.tiempo_segundos) || 0;
                    let m = Math.round((seg / 60) * 10) / 10;
                    serie.tiempo_minutos = (m % 1 === 0) ? Math.round(m) : m;
                }
            }
        },

        actualizarDesdeMinutos(serie) {
            let m = parseFloat(serie.tiempo_minutos);
            if (!isNaN(m) && m > 0) {
                serie.tiempo_segundos = Math.round(m * 60);
            }
        },

        actualizarDesdeSegundos(serie) {
            let s = parseInt(serie.tiempo_segundos);
            if (!isNaN(s) && s > 0) {
                let m = Math.round((s / 60) * 10) / 10;
                serie.tiempo_minutos = (m % 1 === 0) ? Math.round(m) : m;
            }
        },

        ajustarTiempoInteligente(item, serie, factor) {
            if (serie.unidad_tiempo === 'min') {
                let actual = parseFloat(serie.tiempo_minutos);
                if (isNaN(actual) || actual <= 0) {
                    actual = (parseInt(serie.tiempo_segundos) || 300) / 60;
                }
                let paso = actual >= 10 ? 5 : 1;
                let nuevo = Math.max(0.5, Math.round((actual + (factor * paso)) * 10) / 10);
                if (nuevo % 1 === 0) nuevo = Math.round(nuevo);
                serie.tiempo_minutos = nuevo;
                serie.tiempo_segundos = Math.round(nuevo * 60);
            } else {
                let actual = parseInt(serie.tiempo_segundos) || 0;
                let paso = actual >= 60 ? 15 : 5;
                let nuevo = Math.max(5, actual + (factor * paso));
                serie.tiempo_segundos = nuevo;
                let m = Math.round((nuevo / 60) * 10) / 10;
                serie.tiempo_minutos = (m % 1 === 0) ? Math.round(m) : m;
            }
            if (item) {
                this.guardarSerie(item, serie);
            }
        },

        fijarTiempoMinutos(item, serie, minutos) {
            serie.unidad_tiempo = 'min';
            serie.tiempo_minutos = minutos;
            serie.tiempo_segundos = minutos * 60;
            if (item) {
                this.guardarSerie(item, serie);
            }
        },

        fijarTiempoSegundos(item, serie, segundos) {
            serie.unidad_tiempo = 'seg';
            serie.tiempo_segundos = segundos;
            let m = Math.round((segundos / 60) * 10) / 10;
            serie.tiempo_minutos = (m % 1 === 0) ? Math.round(m) : m;
            if (item) {
                this.guardarSerie(item, serie);
            }
        },

        ajustarValor(item, serie, campo, delta) {
            let val = parseFloat(serie[campo]) || 0;
            val = Math.max(0, val + delta);
            // Redondear a 1 decimal si es peso
            if (campo === 'peso_kg') {
                serie[campo] = Math.round(val * 10) / 10;
                this.autopropagarSiAplica(item, serie);
            } else {
                serie[campo] = Math.round(val);
            }
            if (item) {
                this.guardarSerie(item, serie);
            }
        },

        autopropagarSiAplica(item, serie) {
            if (!item || !item.series_sugeridas) return;
            const index = item.series_sugeridas.indexOf(serie);
            if (index === -1) return;

            const nuevoPeso = serie.peso_kg;
            for (let i = index + 1; i < item.series_sugeridas.length; i++) {
                const sig = item.series_sugeridas[i];
                if (!sig.completado && (!sig.peso_kg || sig.peso_kg === '0' || sig.peso_kg === 0)) {
                    sig.peso_kg = nuevoPeso;
                }
            }
        },

        replicarSerie(item, serie) {
            if (!item || !item.series_sugeridas) return;
            const index = item.series_sugeridas.indexOf(serie);
            if (index === -1) return;

            for (let i = index + 1; i < item.series_sugeridas.length; i++) {
                const sig = item.series_sugeridas[i];
                if (!sig.completado) {
                    sig.peso_kg = serie.peso_kg;
                    sig.repeticiones = serie.repeticiones;
                    this.guardarSerie(item, sig);
                }
            }
        },

        aplicarValoresPrevios(item, serie) {
            if (serie.peso_anterior !== undefined && serie.peso_anterior !== '') {
                serie.peso_kg = serie.peso_anterior;
            }
            if (serie.reps_anteriores !== undefined && serie.reps_anteriores !== null) {
                serie.repeticiones = serie.reps_anteriores;
            }
            this.autopropagarSiAplica(item, serie);
            this.guardarSerie(item, serie);
        },

        agregarSerieExtra(item) {
            const ultimoNum = item.series_sugeridas.length > 0 
                ? item.series_sugeridas[item.series_sugeridas.length - 1].numero_serie 
                : 0;
            const anterior = item.series_sugeridas[item.series_sugeridas.length - 1] || {};
            const segAnterior = anterior.tiempo_segundos || 45;
            const minAnterior = anterior.tiempo_minutos || Math.round((segAnterior / 60) * 10) / 10;
            const unidadAnterior = anterior.unidad_tiempo || (segAnterior >= 300 ? 'min' : 'seg');

            item.series_sugeridas.push({
                numero_serie: ultimoNum + 1,
                repeticiones: anterior.repeticiones || 10,
                peso_kg: anterior.peso_kg || '',
                tiempo_segundos: segAnterior,
                tiempo_minutos: minAnterior,
                unidad_tiempo: unidadAnterior,
                distancia_km: anterior.distancia_km || '',
                completado: false
            });
        },

        ajustarDistanciaSerie(item, serie, delta) {
            let actual = parseFloat(serie.distancia_km) || 0;
            actual = Math.max(0, Math.round((actual + delta) * 10) / 10);
            serie.distancia_km = actual;
            this.guardarSerie(item, serie);
        },

        calcularRitmoSerie(serie) {
            const seg = parseInt(serie.tiempo_segundos);
            const km = parseFloat(serie.distancia_km);
            if (seg > 0 && km > 0) {
                const segPorKm = seg / km;
                const m = Math.floor(segPorKm / 60);
                const s = Math.round(segPorKm % 60);
                const sStr = s < 10 ? '0' + s : s;
                return `${m}:${sStr} min/km`;
            }
            return null;
        },

        async alternarSerieCompletada(item, serie) {
            serie.completado = !serie.completado;

            // Feedback háptico táctil en móvil
            if (serie.completado && 'vibrate' in navigator) {
                navigator.vibrate(30);
            }

            // Guardar automáticamente en base de datos vía AJAX
            await this.guardarSerie(item, serie);

            // Si se marca como completada, arrancar el temporizador de descanso
            if (serie.completado) {
                this.iniciarDescanso(60); // 60 segundos de descanso por defecto
            }
        },

        async guardarSerie(item, serie) {
            try {
                let seg = parseInt(serie.tiempo_segundos) || 0;
                if (serie.unidad_tiempo === 'min' && serie.tiempo_minutos !== undefined && serie.tiempo_minutos !== null && serie.tiempo_minutos !== '') {
                    let m = parseFloat(serie.tiempo_minutos);
                    if (!isNaN(m) && m > 0) {
                        seg = Math.round(m * 60);
                        serie.tiempo_segundos = seg;
                    }
                }

                const payload = {
                    ejercicio_id: item.ejercicio_id,
                    numero_serie: serie.numero_serie,
                    repeticiones: serie.repeticiones,
                    peso: serie.peso_kg,
                    tiempo_segundos: seg,
                    tiempo_minutos: serie.tiempo_minutos,
                    distancia_km: serie.distancia_km,
                    rutina_nombre: this.rutinaNombre
                };

                const response = await fetch("{% url 'rutinas:guardar_serie_ajax' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.csrfToken
                    },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                if (res.status !== 'success') {
                    console.error("Error al guardar serie:", res.message);
                }
            } catch (err) {
                console.error("Error de conexión al guardar serie:", err);
            }
        },

        iniciarDescanso(segundos) {
            clearInterval(this.intervaloDescanso);
            this.descansoTotal = segundos;
            this.descansoRestante = segundos;
            this.descansoActivo = true;

            this.intervaloDescanso = setInterval(() => {
                if (this.descansoRestante > 0) {
                    this.descansoRestante--;
                } else {
                    this.detenerDescanso();
                    // Alarma sutil
                    const audio = document.getElementById('audioFinDescanso');
                    if (audio) audio.play().catch(() => {});
                    if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        },

        sumarDescanso(segundos) {
            this.descansoRestante += segundos;
            this.descansoTotal += segundos;
        },

        detenerDescanso() {
            clearInterval(this.intervaloDescanso);
            this.descansoActivo = false;
        },

        async finalizarEntrenamiento() {
            const completadas = this.seriesCompletadasTotales;
            const total = this.totalSeriesTotales;

            if (!confirm(`¿Deseas finalizar tu entrenamiento? Has completado ${completadas} de ${total} series.`)) {
                return;
            }

            if (this.wakeLock) {
                try { await this.wakeLock.release(); } catch (e) {}
            }

            try {
                const response = await fetch("{% url 'rutinas:finalizar_entrenamiento_ajax' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.csrfToken
                    }
                });
                const res = await response.json();
                if (res.status === 'success') {
                    window.location.href = res.redirect_url || "{% url 'dashboard:dashboard' %}";
                }
            } catch (err) {
                window.location.href = "{% url 'dashboard:dashboard' %}";
            }
        }
    }
}
</script>
{% endblock %}
