{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión | OPTIFIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-light: #84cc16;
            --brand-dark: #65a30d;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between p-6 antialiased selection:bg-[#84cc16] selection:text-black">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto flex items-center justify-center pt-6">
        <img src="{% static 'img/logo.png' %}" alt="OPTIFIT" class="h-10 w-auto object-contain">
    </header>

    <!-- Contenido Central -->
    <main class="w-full max-w-md mx-auto my-auto text-center space-y-6 py-10">
        
        <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
            <div class="absolute inset-0 bg-[#84cc16]/10 rounded-3xl animate-pulse"></div>
            <div class="w-20 h-20 rounded-2xl bg-gray-900 border border-gray-800 flex items-center justify-center text-[#84cc16] text-3xl shadow-xl">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <span class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-red-500 text-white flex items-center justify-center text-xs shadow-md">
                <i class="fa-solid fa-slash"></i>
            </span>
        </div>

        <div class="space-y-2">
            <div class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-bold">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Modo Sin Conexión</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Sin conexión a Internet</h1>
            <p class="text-sm text-gray-400 max-w-sm mx-auto leading-relaxed">
                Parece que has perdido la señal de datos o Wi-Fi en el gimnasio. Puedes seguir consultando las pantallas que ya abriste o pulsar en reintentar.
            </p>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="window.location.reload();" 
                    class="w-full py-3.5 px-6 rounded-xl bg-[#84cc16] hover:bg-[#65a30d] text-gray-950 font-black text-sm shadow-lg shadow-lime-500/20 transition-all flex items-center justify-center space-x-2 active:scale-95">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Reintentar Conexión</span>
            </button>
            <button onclick="window.history.back();" 
                    class="w-full py-3.5 px-6 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold text-sm border border-gray-800 transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Volver Atrás</span>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto text-center text-xs text-gray-600 pb-4">
        OPTIFIT • Tu aplicación de entrenamiento instalada
    </footer>

</body>
</html>
