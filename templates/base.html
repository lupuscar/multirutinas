<!DOCTYPE html>
<!-- Configuramos Alpine.js para manejar el modo oscuro a nivel global -->
<html lang="es" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App Deportiva{% endblock %}</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5', // Índigo vibrante (deportivo)
                            dark: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js (CDN) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- FontAwesome (CDN) para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 flex h-screen overflow-hidden">

    <!-- Alpine.js state para la barra lateral -->
    <div x-data="{ sidebarOpen: true }" class="flex w-full h-full">

        <!-- Barra Lateral (Sidebar) -->
        <aside class="bg-white dark:bg-gray-800 w-64 shadow-lg transition-all duration-300 flex flex-col"
               :class="{'w-64': sidebarOpen, 'w-16': !sidebarOpen}">
            
            <!-- Logo / Título -->
            <div class="h-16 flex items-center justify-center border-b dark:border-gray-700">
                <i class="fa-solid fa-dumbbell text-brand-light text-2xl"></i>
                <span x-show="sidebarOpen" class="ml-3 font-bold text-xl tracking-wider">FIT<span class="text-brand-light">APP</span></span>
            </div>

            <!-- Menú de navegación -->
            <nav class="flex-1 px-2 py-4 space-y-2">
                <!-- Admin -->
                <a href="/admin/" class="flex items-center px-4 py-3 text-gray-600 dark:text-gray-300 hover:bg-brand-light hover:text-white rounded-lg transition-colors group">
                    <i class="fa-solid fa-gauge-high text-lg"></i>
                    <span x-show="sidebarOpen" class="ml-4 font-medium">Admin</span>
                </a>
                
                <!-- Separador -->
                <div x-show="sidebarOpen" class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                    Configuración
                </div>
                <div x-show="!sidebarOpen" class="h-4"></div>

                <!-- Perfil -->
                <a href="{% url 'users:perfil' %}" class="flex items-center px-4 py-3 bg-brand-light/10 text-brand-light dark:bg-brand-light/20 dark:text-indigo-300 rounded-lg transition-colors">
                    <i class="fa-solid fa-user text-lg"></i>
                    <span x-show="sidebarOpen" class="ml-4 font-medium">Mi Perfil</span>
                </a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Barra superior (Header) -->
            <header class="h-16 bg-white dark:bg-gray-800 shadow-sm flex items-center justify-between px-6 transition-colors duration-300">
                <!-- Botón para alternar Sidebar -->
                <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 hover:text-brand-light focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <!-- Botón para Modo Claro / Oscuro -->
                <button @click="darkMode = !darkMode" class="text-gray-500 hover:text-yellow-500 dark:hover:text-blue-300 focus:outline-none transition-colors">
                    <i class="fa-solid" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
                </button>
            </header>

            <!-- Área dinámica donde se inyectarán otras plantillas -->
            <div class="flex-1 overflow-y-auto p-6">
                {% if messages %}
                    <div class="mb-6 space-y-2">
                        {% for message in messages %}
                            <div class="p-4 rounded-lg shadow-sm text-sm font-medium {% if message.tags == 'success' %}bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400{% else %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

</body>
</html>
