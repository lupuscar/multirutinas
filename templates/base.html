<!DOCTYPE html>
<html lang="es" class="{% if request.COOKIES.theme == 'dark' %}dark{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App Deportiva{% endblock %}</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5',
                            dark: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado para controlar el colapso del Sidebar sin Alpine -->
    <style>
        /* Estado Colapsado por defecto/cookie */
        .sidebar-collapsed #sidebar {
            width: 4rem !important; /* w-16 */
        }
        .sidebar-collapsed .sidebar-text {
            display: none !important;
        }
        .sidebar-collapsed .sidebar-divider-title {
            display: none !important;
        }
        .sidebar-collapsed .sidebar-divider-line {
            display: block !important;
        }

        /* En dispositivos móviles */
        @media (max-width: 767px) {
            #sidebar {
                transform: translateX(-100%);
            }
            .sidebar-open #sidebar {
                transform: translateX(0) !important;
                width: 16rem !important; /* w-64 */
            }
            .sidebar-open .sidebar-text {
                display: inline !important;
            }
            .sidebar-open #mobile-overlay {
                display: block !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 flex h-screen overflow-hidden {% if request.COOKIES.sidebar == 'collapsed' %}sidebar-collapsed{% endif %}">

    <div class="flex w-full h-full relative">

        {% if user.is_authenticated %}
        <!-- Overlay Móvil -->
        <div id="mobile-overlay" 
             onclick="toggleSidebar()" 
             class="hidden fixed inset-0 z-20 bg-black/50 backdrop-blur-sm md:hidden">
        </div>

        <!-- Barra Lateral (Sidebar) -->
        <aside id="sidebar" 
               class="fixed md:static inset-y-0 left-0 z-30 bg-white dark:bg-gray-800 w-64 shadow-lg transition-all duration-300 flex flex-col justify-between">
            
            <div>
                <!-- Logo / Título -->
                <div class="h-16 flex items-center justify-between px-4 border-b dark:border-gray-700">
                    <div class="flex items-center">
                        <i class="fa-solid fa-dumbbell text-brand-light text-2xl"></i>
                        <span class="sidebar-text ml-3 font-bold text-xl tracking-wider">FIT<span class="text-brand-light">APP</span></span>
                    </div>
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-brand-light focus:outline-none">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <!-- Menú de navegación -->
                <nav class="flex-1 px-2 py-4 space-y-2">
                    
                    <!-- Dashboard -->
                    <a href="{% url 'dashboard:dashboard' %}" class="flex items-center px-4 py-3 rounded-lg transition-colors group {% if request.resolver_match.url_name == 'dashboard' %}bg-brand-light text-white{% else %}text-gray-600 dark:text-gray-300 hover:bg-brand-light hover:text-white{% endif %}">
                        <i class="fa-solid fa-gauge-high text-lg"></i>
                        <span class="sidebar-text ml-4 font-medium">Dashboard</span>
                    </a>

                    <!-- Admin -->
                    <a href="/admin/" class="flex items-center px-4 py-3 text-gray-600 dark:text-gray-300 hover:bg-brand-light hover:text-white rounded-lg transition-colors group">
                        <i class="fa-solid fa-shield-halved text-lg"></i>
                        <span class="sidebar-text ml-4 font-medium">Admin</span>
                    </a>

                    <!-- Separador dinámico -->
                    <div class="px-3 my-3">
                        <div class="sidebar-divider-title flex items-center space-x-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                            <span>Configuración</span>
                            <div class="flex-1 border-t dark:border-gray-700"></div>
                        </div>
                        <div class="sidebar-divider-line hidden border-t border-gray-200 dark:border-gray-700 my-2"></div>
                    </div>

                    <!-- Perfil -->
                    <a href="{% url 'users:perfil' %}" class="flex items-center px-4 py-3 rounded-lg transition-colors group {% if request.resolver_match.url_name == 'perfil' %}bg-brand-light text-white{% else %}text-gray-600 dark:text-gray-300 hover:bg-brand-light hover:text-white{% endif %}">
                        <i class="fa-solid fa-user text-lg"></i>
                        <span class="sidebar-text ml-4 font-medium">Mi Perfil</span>
                    </a>

                    <!-- Ejercicio -->
                    <a href="{% url 'ejercicios:ejercicios' %}" class="flex items-center px-4 py-3 rounded-lg transition-colors group {% if request.resolver_match.url_name == 'ejercicios' %}bg-brand-light text-white{% else %}text-gray-600 dark:text-gray-300 hover:bg-brand-light hover:text-white{% endif %}">
                        <i class="fa-solid fa-dumbbell text-lg"></i>
                        <span class="sidebar-text ml-4 font-medium">Ejercicio</span>
                    </a>
                </nav>
            </div>

            <!-- Logout -->
            <div class="p-2 border-t dark:border-gray-700">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="w-full flex items-center px-4 py-3 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors group focus:outline-none">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        <span class="sidebar-text ml-4 font-medium">Cerrar Sesión</span>
                    </button>
                </form>
            </div>

        </aside>
        {% endif %}

        <!-- Contenido Principal -->
        <main class="flex-1 flex flex-col h-full overflow-hidden w-full">
            <header class="h-16 bg-white dark:bg-gray-800 shadow-sm flex items-center justify-between px-6 transition-colors duration-300 z-10">
                {% if user.is_authenticated %}
                <button onclick="toggleSidebar()" class="text-gray-500 hover:text-brand-light focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                {% else %}
                <div></div>
                {% endif %}

                <button onclick="toggleTheme()" class="text-gray-500 hover:text-yellow-500 dark:hover:text-blue-300 focus:outline-none transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon dark:fa-sun"></i>
                </button>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-6">
                {% if messages %}
                    <div class="mb-6 space-y-2">
                        {% for message in messages %}
                            <div class="p-4 rounded-lg shadow-sm text-sm font-medium {% if message.tags == 'success' %}bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400{% else %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- JavaScript ultra-liviano nativo (JS Vainilla) -->
    <script>
        function toggleSidebar() {
            const body = document.body;
            const isMobile = window.innerWidth < 768;

            if (isMobile) {
                body.classList.toggle('sidebar-open');
            } else {
                body.classList.toggle('sidebar-collapsed');
                const isCollapsed = body.classList.contains('sidebar-collapsed');
                document.cookie = `sidebar=${isCollapsed ? 'collapsed' : 'expanded'}; path=/; max-age=31536000`;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            document.cookie = `theme=${isDark ? 'dark' : 'light'}; path=/; max-age=31536000`;
        }
    </script>
</body>
</html>
